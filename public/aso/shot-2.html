<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Tilmidh — capture 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; height: 100%; background: #030303; color: #f5f5f7; font-family: Outfit, sans-serif; }
        .phone { min-height: 100%; display: flex; flex-direction: column; padding: 48px 28px 40px; box-sizing: border-box; }
        .brand { color: #059669; font-weight: 600; letter-spacing: 0.04em; font-size: 0.85rem; }
        h1 { font-size: 1.55rem; line-height: 1.25; margin: 12px 0 28px; font-weight: 600; }
        .ayah { font-family: Amiri, serif; direction: rtl; text-align: right; font-size: 2.2rem; line-height: 2.3; }
        .ayah span { display: inline-block; margin: 6px 4px; padding: 4px 8px; border-radius: 10px; background: #059669; color: #fff; }
        .pill { margin-top: auto; align-self: center; background: #059669; color: #fff; padding: 14px 28px; border-radius: 999px; font-weight: 600; }
        .sub { text-align: center; color: #86868b; font-size: 0.85rem; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="brand">Tilmidh تلميذ</div>
        <h1>Ikhlāṣ, Falaq, Nās, Fātiḥah.</h1>
        <p class="ayah">
            <span>قُلْ</span>
            <span>هُوَ</span>
            <span>ٱللَّهُ</span>
            <span>أَحَدٌ</span>
        </p>
        <div class="pill">Installer sur l’écran d’accueil</div>
        <p class="sub">Outil d’entraînement — pas une ijazah</p>
    </div>
</body>
</html>
