<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Tilmidh — capture 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; height: 100%; background: #f4f7fb; color: #0f172a; font-family: Outfit, sans-serif; }
        .phone { min-height: 100%; display: flex; flex-direction: column; padding: 48px 28px 40px; box-sizing: border-box; }
        .brand { color: #2563eb; font-weight: 600; letter-spacing: 0.04em; font-size: 0.85rem; }
        h1 { font-size: 1.55rem; line-height: 1.25; margin: 12px 0 28px; font-weight: 600; }
        .dock { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 28px; }
        .pill { background: #2563eb; color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 0.95rem; }
        .ghost { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; padding: 10px 16px; border-radius: 999px; font-size: 0.95rem; }
        .sub { margin-top: auto; text-align: center; color: #64748b; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="brand">Tilmidh تلميذ</div>
        <h1>Al-Fātiḥah, Ayat al-Kursi, Al-Kahf, Al-Mulk.</h1>
        <div class="dock">
            <span class="pill">الفاتحة</span>
            <span class="ghost">الكرسي</span>
            <span class="ghost">الكهف</span>
            <span class="ghost">الملك</span>
        </div>
        <p class="sub">Outil d’entraînement — pas une ijazah</p>
    </div>
</body>
</html>
