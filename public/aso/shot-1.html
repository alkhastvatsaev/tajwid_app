<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Tilmidh — capture 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; height: 100%; background: #030303; color: #f5f5f7; font-family: Outfit, sans-serif; }
        .phone { min-height: 100%; display: flex; flex-direction: column; padding: 48px 28px 40px; box-sizing: border-box; }
        .brand { color: #059669; font-weight: 600; letter-spacing: 0.04em; font-size: 0.85rem; }
        h1 { font-size: 1.55rem; line-height: 1.25; margin: 12px 0 28px; font-weight: 600; }
        .ayah { font-family: Amiri, serif; direction: rtl; text-align: right; font-size: 2.1rem; line-height: 2.2; }
        .ayah span { display: inline-block; margin: 6px 4px; padding: 4px 8px; border-radius: 10px; }
        .ok { background: #059669; color: #fff; }
        .now { outline: 2px solid #34d399; background: rgba(5,150,105,0.25); }
        .wait { color: #86868b; }
        .caption { margin-top: auto; padding-top: 36px; font-size: 1.05rem; color: #d1d5db; }
        .caption strong { color: #34d399; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="brand">Tilmidh تلميذ</div>
        <h1>Chaque mot. Une case verte.</h1>
        <p class="ayah">
            <span class="ok">بِسْمِ</span>
            <span class="ok">ٱللَّهِ</span>
            <span class="ok">ٱلرَّحْمَٰنِ</span>
            <span class="now">ٱلرَّحِيمِ</span>
            <span class="wait">ٱلْحَمْدُ</span>
            <span class="wait">لِلَّهِ</span>
        </p>
        <p class="caption">Tu récites. Le micro vérifie. <strong>Le mot passe au vert.</strong></p>
    </div>
</body>
</html>
