name: Multi-Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify_static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify production static bundle
        run: |
          test -f public/index.html
          test -f vercel.json
          grep -q '"outputDirectory": "public"' vercel.json
